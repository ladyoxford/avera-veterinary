services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: avera
      POSTGRES_USER: avera
      POSTGRES_PASSWORD: development-only-change-me
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avera -d avera"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - avera_postgres:/var/lib/postgresql/data

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://avera:development-only-change-me@postgres:5432/avera
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  avera_postgres:
