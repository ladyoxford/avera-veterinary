<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Open AVERA</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #071917; color: #f4fbfa; }
      main { width: min(420px, calc(100% - 40px)); text-align: center; }
      h1 { margin-bottom: 10px; font-size: 28px; }
      p { color: #b9ccca; line-height: 1.5; }
      button { width: 100%; min-height: 52px; margin-top: 18px; border: 0; border-radius: 8px; background: #087f7b; color: white; font: inherit; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: .5; cursor: default; }
    </style>
  </head>
  <body>
    <main>
      <h1>Opening AVERA...</h1>
      <p id="message">Complete account activation securely inside the AVERA app. The app must be installed on this device.</p>
      <button id="open" type="button">Open AVERA</button>
    </main>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        window.history.replaceState({}, '', '/activate-clinic-admin');
        const button = document.getElementById('open');
        if (!token) {
          button.disabled = true;
          document.getElementById('message').textContent = 'This activation link is incomplete. Request a new link from your AVERA Platform Owner.';
          return;
        }
        const openApp = () => {
          window.location.assign(`avera://app/activate-clinic-admin?token=${encodeURIComponent(token)}`);
        };
        button.addEventListener('click', openApp);
        window.setTimeout(openApp, 150);
      })();
    </script>
  </body>
</html>
