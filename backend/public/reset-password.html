<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Reset your AVERA password</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #071917; color: #f4fbfa; }
      main { width: min(440px, calc(100% - 40px)); }
      h1 { margin: 0 0 10px; font-size: 30px; }
      p { color: #b9ccca; line-height: 1.5; }
      label { display: block; margin-top: 18px; font-weight: 700; }
      input { width: 100%; min-height: 52px; margin-top: 7px; padding: 12px 14px; border: 1px solid #48615e; border-radius: 8px; background: #102522; color: inherit; font: inherit; }
      button { width: 100%; min-height: 52px; margin-top: 22px; border: 0; border-radius: 8px; background: #087f7b; color: white; font: inherit; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: .55; cursor: default; }
      #message { min-height: 24px; }
      .error { color: #ffb4ab; }
      .success { color: #9fe4d8; }
    </style>
  </head>
  <body>
    <main>
      <h1>Reset your password</h1>
      <p>Choose a strong password with at least 12 characters, upper-case and lower-case letters, a number, and a symbol.</p>
      <form id="form">
        <label for="password">New password</label>
        <input id="password" type="password" minlength="12" autocomplete="new-password" required>
        <label for="confirm">Confirm password</label>
        <input id="confirm" type="password" minlength="12" autocomplete="new-password" required>
        <button id="submit" type="submit">Reset Password</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
    </main>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        window.history.replaceState({}, '', '/reset-password');
        const form = document.getElementById('form');
        const submit = document.getElementById('submit');
        const message = document.getElementById('message');
        if (!token) {
          form.hidden = true;
          message.className = 'error';
          message.textContent = 'This reset link is incomplete. Request a new link from the AVERA sign-in page.';
          return;
        }
        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          const password = document.getElementById('password').value;
          const confirmPassword = document.getElementById('confirm').value;
          if (password !== confirmPassword) {
            message.className = 'error';
            message.textContent = 'The password confirmation does not match.';
            return;
          }
          submit.disabled = true;
          message.className = '';
          message.textContent = 'Resetting your password...';
          try {
            const response = await fetch('/api/v1/auth/reset-password', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ token, password, confirmPassword }),
            });
            const body = await response.json();
            if (!response.ok) throw new Error(body.message || 'Password reset failed.');
            form.hidden = true;
            message.className = 'success';
            message.textContent = 'Your password has been reset. Return to AVERA and sign in with the new password.';
          } catch (error) {
            submit.disabled = false;
            message.className = 'error';
            message.textContent = error.message || 'Password reset failed.';
          }
        });
      })();
    </script>
  </body>
</html>
